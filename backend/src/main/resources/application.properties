spring.datasource.url=jdbc:postgresql://localhost:5432/odonto
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=1234567890123456789012345678901234567890
app.jwt.expiration-ms=86400000
spring.jpa.open-in-view=false

server.port=8080
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.scheduler.tenant-id=1

# WhatsApp fica em modo stub por padrao. Configure estes campos para usar um provedor real.
app.whatsapp.enabled=false
app.whatsapp.api-url=
app.whatsapp.token=
app.whatsapp.aniversario.cron=0 0 9 * * *
app.whatsapp.promocao.cron=0 30 10 * * *
app.whatsapp.promocao.dias-sem-comparecer=180
app.whatsapp.promocao.intervalo-reenvio-dias=90

# Configure com o caminho do Tesseract para ativar OCR local.
app.ocr.command=C:/Program Files/Tesseract-OCR/tesseract.exe
app.ocr.language=por
app.ocr.tessdata-dir=C:/Users/Marcio La Puma/workspace/odontologia-saas/.tools/tessdata

# Ative para ler campos preenchidos a caneta usando visao/IA.
# A chave pode vir daqui ou da variavel de ambiente OPENAI_API_KEY.
app.ocr.openai.enabled=true
app.ocr.openai.api-key=
app.ocr.openai.model=gpt-4.1

# Google Business Profile. Configure estas variaveis de ambiente com as credenciais OAuth do Google Cloud.
google.business-profile.client-id=${GOOGLE_BUSINESS_PROFILE_CLIENT_ID:}
google.business-profile.client-secret=${GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET:}
google.business-profile.redirect-uri=${GOOGLE_BUSINESS_PROFILE_REDIRECT_URI:http://localhost:8080/api/integracoes/google-business-profile/callback}
google.business-profile.token-file=${GOOGLE_BUSINESS_PROFILE_TOKEN_FILE:data/google-business-profile-token.json}
