spring.datasource.url=jdbc:postgresql://localhost:5432/odonto
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=1234567890123456789012345678901234567890
app.jwt.expiration-ms=86400000
spring.jpa.open-in-view=false

server.port=8080

app.scheduler.tenant-id=1

# WhatsApp fica em modo stub por padrao. Configure estes campos para usar um provedor real.
app.whatsapp.enabled=false
app.whatsapp.api-url=
app.whatsapp.token=
app.whatsapp.aniversario.cron=0 0 9 * * *
app.whatsapp.promocao.cron=0 30 10 * * *
app.whatsapp.promocao.dias-sem-comparecer=180
app.whatsapp.promocao.intervalo-reenvio-dias=90
