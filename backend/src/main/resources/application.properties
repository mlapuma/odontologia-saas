spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/odonto}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}

app.jwt.secret=${APP_JWT_SECRET:1234567890123456789012345678901234567890}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

app.scheduler.tenant-id=${APP_SCHEDULER_TENANT_ID:1}

# Configure estes campos para envio automatico por provedor/API de WhatsApp.
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.api-url=${WHATSAPP_API_URL:}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.aniversario.cron=${WHATSAPP_ANIVERSARIO_CRON:0 0 9 * * *}
app.whatsapp.promocao.cron=${WHATSAPP_PROMOCAO_CRON:0 30 10 * * *}
app.whatsapp.promocao.dias-sem-comparecer=${WHATSAPP_PROMOCAO_DIAS_SEM_COMPARECER:180}
app.whatsapp.promocao.intervalo-reenvio-dias=${WHATSAPP_PROMOCAO_INTERVALO_REENVIO_DIAS:90}

# Configure com o caminho do Tesseract para ativar OCR local.
app.ocr.command=${APP_OCR_COMMAND:C:/Program Files/Tesseract-OCR/tesseract.exe}
app.ocr.language=${APP_OCR_LANGUAGE:por}
app.ocr.tessdata-dir=${APP_OCR_TESSDATA_DIR:C:/Users/Marcio La Puma/workspace/odontologia-saas/.tools/tessdata}

# Ative para ler campos preenchidos a caneta usando visao/IA.
# A chave pode vir daqui ou da variavel de ambiente OPENAI_API_KEY.
app.ocr.openai.enabled=${APP_OCR_OPENAI_ENABLED:true}
app.ocr.openai.api-key=${OPENAI_API_KEY:}
app.ocr.openai.model=${APP_OCR_OPENAI_MODEL:gpt-4.1}

# Google Business Profile. Configure estas variaveis de ambiente com as credenciais OAuth do Google Cloud.
google.business-profile.client-id=${GOOGLE_BUSINESS_PROFILE_CLIENT_ID:}
google.business-profile.client-secret=${GOOGLE_BUSINESS_PROFILE_CLIENT_SECRET:}
google.business-profile.redirect-uri=${GOOGLE_BUSINESS_PROFILE_REDIRECT_URI:http://localhost:8080/api/integracoes/google-business-profile/callback}
google.business-profile.token-file=${GOOGLE_BUSINESS_PROFILE_TOKEN_FILE:data/google-business-profile-token.json}
