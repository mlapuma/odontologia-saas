version: "2.4"

services:
  db:
    image: postgres:16-alpine
    container_name: odontologia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: odontologia-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_OCR_COMMAND: /usr/bin/tesseract
      APP_OCR_TESSDATA_DIR: /usr/share/tesseract-ocr/5/tessdata
      GOOGLE_BUSINESS_PROFILE_TOKEN_FILE: /app/data/google-business-profile-token.json
    volumes:
      - backend_data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 8

  frontend:
    build:
      context: ./frontend
    container_name: odontologia-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres_data:
  backend_data:
