<div class="layout">
    <header class="topbar">
        <a class="brand" routerLink="/app/dashboard" aria-label="Abrir menu principal">
            <img src="assets/lacari-icon.png" alt="Clínica LaCari Odontologia" />
            <div>
                <strong>LaCari</strong>
                <span>Odontologia</span>
            </div>
        </a>

        <div class="topbar-acoes">
            <a class="btn-menu" routerLink="/app/dashboard">Menu principal</a>

            <div class="usuario">
                <img src="assets/lacari-icon.png" alt="" />
                <div>
                    <strong>{{ nomeUsuario }}</strong>
                    <span class="perfil">{{ perfil }}</span>
                </div>
            </div>

            <button (click)="logout()">Sair</button>
        </div>
    </header>

    <main class="content">
        <router-outlet></router-outlet>
    </main>
</div>
